<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 判断力课程 · Podcast to Course</title>
<meta name="description" content="从播客到判断力——AI 产品思考者的结构化学习资产库。每期多人对话被提炼为框架卡、决策清单、场景测验和交互式 HTML 课程。">
<meta property="og:title" content="AI 判断力课程">
<meta property="og:description" content="从播客到判断力——AI 产品思考者的结构化学习资产库。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFAF5;--bg-card:#F8F4EC;--bg-code:#1E1E2E;--text:#2C2C2C;--text2:#6B6B6B;--text3:#999;--accent:#D94F30;--accent-h:#C4432A;--accent-l:#FDEEE9;--border:#E8E0D5;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);--shadow-h:0 4px 12px rgba(0,0,0,.08);--ease:cubic-bezier(.4,0,.2,1);--font-display:'Bricolage Grotesque',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace}
[data-theme="dark"]{--bg:#1A1A1A;--bg-card:#242424;--text:#E0DED4;--text2:#A09E94;--text3:#706E64;--accent-l:rgba(217,79,48,.12);--border:#333;--shadow:none;--shadow-h:0 4px 12px rgba(0,0,0,.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s var(--ease),color .3s var(--ease);-webkit-font-smoothing:antialiased}
.container{max-width:880px;margin:0 auto;padding:0 1.5rem}
/* nav */
.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 0;border-bottom:1px solid var(--border);margin-bottom:3rem}
.nav-logo{font-family:var(--font-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;color:var(--text);text-decoration:none}
.nav-logo span{color:var(--accent)}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:24px;padding:.4rem .85rem;cursor:pointer;font-size:.8rem;color:var(--text2);transition:all .2s var(--ease);font-family:var(--font-body)}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
/* hero */
.hero{margin-bottom:3rem}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:2.4rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:.75rem}
.hero p{font-size:1.05rem;color:var(--text2);max-width:600px;line-height:1.7}
.hero .badge-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.badge{display:inline-block;font-family:var(--font-mono);font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:.25rem .7rem;border-radius:20px;background:var(--accent-l);color:var(--accent);border:1px solid rgba(217,79,48,.15)}
/* grid */
.course-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;margin-bottom:4rem}
@media(min-width:640px){.course-grid{grid-template-columns:1fr 1fr}}
.course-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;transition:all .25s var(--ease);text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:.65rem;box-shadow:var(--shadow)}
.course-card:hover{border-color:var(--accent);box-shadow:var(--shadow-h);transform:translateY(-2px)}
.course-card .meta{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:500}
.course-card h3{font-family:var(--font-display);font-weight:700;font-size:1.15rem;line-height:1.3;letter-spacing:-.01em}
.course-card .podcast{font-size:.85rem;color:var(--text3)}
.course-card .frameworks{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:auto;padding-top:.5rem}
.course-card .fw-tag{font-size:.7rem;padding:.15rem .55rem;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text2);font-family:var(--font-body)}
/* footer */
.footer{text-align:center;padding:2.5rem 0 4rem;border-top:1px solid var(--border);color:var(--text3);font-size:.82rem}
.footer a{color:var(--accent);text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
  <nav class="nav-bar">
    <a href="/podcast-to-course/" class="nav-logo">AI<span>·</span>判断力</a>
    <button class="theme-toggle" id="themeToggle" aria-label="切换暗色模式">🌙 dark</button>
  </nav>
  <header class="hero">
    <h1>从播客到判断力</h1>
    <p>AI 产品思考者的结构化学习资产库。每期对话被提炼为框架卡、决策清单、场景测验和交互式 HTML 课程——听完、学过、练过、沉淀过。</p>
    <div class="badge-row">
      <span class="badge">10 个框架</span><span class="badge">4 期课程</span><span class="badge">public content only</span>
    </div>
  </header>
  <div class="course-grid" id="courseGrid"></div>
  <footer class="footer">
    <p>由 <a href="https://github.com/Cobb04/podcast-to-course">podcast-to-course</a> 生成 · 内容 100% 基于 transcript · 通义听悟仅用于 ASR 转写</p>
    <p style="margin-top:.4rem">Built with Claude Code · 公开内容 · 不绕过任何平台权限</p>
  </footer>
</div>
<script>
const COURSES=[
  {date:"2026-07-19",title:"AI 发展了 4 年，把应用发展没了？",podcast:"42章经",host:"曲凯",frameworks:["锤子-钉子套利","期权不爆仓","逆风期=最好时光"],slug:"2026-07-19-ai-midyear-app-is-dead",accent:"#2D8B55"},
  {date:"2026-07-08",title:"为什么支付宝和微信的 AI，打开一次就不想再打开",podcast:"哇哦产品",host:"Link",frameworks:["责任成本","导航-委托光谱","奔驰vs优惠券"],slug:"2026-07-08-super-app-ai-paradox",accent:"#D94F30"},
  {date:"2026-05-19",title:"AI 时代人应该有两个自己——一个干活，一个生活",podcast:"以鹅传鹅FM",host:"Jason·王博源",frameworks:["哆啦A梦口袋","调错退回人脑","品味护城河"],slug:"2026-05-19-ai-two-selves-workbuddy",accent:"#2A7B9B"},
  {date:"2026-05-15",title:"豆包访谈首秀：硅谷00后AI产品经理入行靠的竟是狗运",podcast:"OtherWise他山之玉",host:"Harry(豆包AI访谈)",frameworks:["AI学习五步法","无包袱优势"],slug:"2026-05-15-doubao-ai-pm-dog-luck",accent:"#D4A843"}
];
(function(){
  var grid=document.getElementById("courseGrid");
  COURSES.forEach(function(c){
    var tags=c.frameworks.map(function(f){return'<span class="fw-tag">'+f+"</span>"}).join("");
    var card='<a class="course-card" href="courses/'+c.slug+'/" style="border-left:3px solid '+c.accent+'">'+
      '<span class="meta">'+c.date+" · "+c.host+"</span>"+
      "<h3>"+c.title+"</h3>"+
      '<span class="podcast">🎙️ '+c.podcast+"</span>"+
      '<div class="frameworks">'+tags+"</div></a>";
    grid.insertAdjacentHTML("beforeend",card);
  });
  var btn=document.getElementById("themeToggle"),html=document.documentElement;
  btn.addEventListener("click",function(){
    var next=html.getAttribute("data-theme")==="light"?"dark":"light";
    html.setAttribute("data-theme",next);
    btn.innerHTML=next==="light"?"🌙 dark":"☀️ light";
    try{localStorage.setItem("theme",next)}catch(e){}
  });
  try{
    var saved=localStorage.getItem("theme");
    if(saved){
      html.setAttribute("data-theme",saved);
      btn.innerHTML=saved==="light"?"🌙 dark":"☀️ light";
    }
  }catch(e){}
})();
</script>
</body>
</html>
